name: Release

# Publishes nuxt-early-404 to npm from a v* tag using npm trusted publishing.
# Configure the npm package's trusted publisher for this repository and workflow
# before creating the first release tag. No long-lived NPM_TOKEN is used.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Do not configure registry-url here. actions/setup-node writes an empty
      # auth token line when no token exists, which prevents npm's OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Ensure npm supports trusted publishing
        run: |
          REQUIRED=11.5.1
          CURRENT="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$REQUIRED" "$CURRENT" | sort -V | head -1)" != "$REQUIRED" ]; then
            echo "npm $CURRENT is older than $REQUIRED; installing npm@^11"
            npm install -g npm@^11
          fi
          echo "npm $(npm --version)"

      - name: Install
        run: npm ci

      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME wants version $TAG_VERSION but package.json says $PKG_VERSION."
            exit 1
          fi
          echo "Publishing $PKG_VERSION"

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Build the production fixture
        working-directory: test/fixtures/runtime-app
        run: npx nuxt build

      - name: Pack only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm pack --dry-run

      - name: Assert nothing is pre-authenticated
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for npmrc in "$HOME/.npmrc" .npmrc; do
            [ -f "$npmrc" ] && sed -i '/_authToken/d' "$npmrc" && echo "stripped auth lines from $npmrc"
          done
          echo "registry: $(npm config get registry)"
          test "$(npm config get registry)" = "https://registry.npmjs.org/"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish
